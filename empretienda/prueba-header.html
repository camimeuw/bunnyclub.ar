<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba local - header</title>
<style>
/* Simula la plantilla/UIkit */
body{margin:0;font-family:Arial,sans-serif;background:#fff}
.background--primary{background:#111}.text--primary{color:#fff}.contrast_text--primary{color:#fff}
.header-announcement{background:#111;padding:8px;text-align:center}
.uk-container{max-width:1200px;margin:auto;padding:0 20px}
.uk-flex{display:flex}.uk-flex-middle{align-items:center}.uk-flex-between{justify-content:space-between}
.uk-visible\@m{display:none}.uk-hidden\@m{display:flex}
@media(min-width:960px){.uk-visible\@m{display:flex}.uk-hidden\@m{display:none}}
[hidden]{display:none!important}
ul{list-style:none;margin:0;padding:0}.desktop-list__item{margin:0 14px}a{color:inherit;text-decoration:none}
.uk-dropdown{display:none}.header-logo__image{display:block}
.header-logo__image{max-height:60px;height:auto}.header-logo{height:60px}
</style><link rel="stylesheet" href="prueba-header.css"></head><body>
<p class="header-announcement__text contrast_text--primary">Bienvenid@ a Harakiri💖</p>
<div class="header-menu background--primary" style="min-height: 115px;"><div class="uk-container">
<nav class="header-menu__desktop uk-flex uk-flex-middle uk-flex-between uk-visible@m" style="min-height: 115px;">
<div class="header-logo header__left nav-overlay uk-flex uk-flex-middle"><a href="#" class="header-logo__link"><img src="logo-harakiri-liviano.png" class="header-logo__image" alt="Logo"></a></div>
<ul class="header-menu__desktop-list nav-overlay uk-flex uk-flex-middle" style="min-height: 115px;">
<li class="desktop-list__item text--primary">Inicio</li><li class="desktop-list__item text--primary">Productos</li><li class="desktop-list__item text--primary">Información</li><li class="desktop-list__item text--primary">Contacto</li><li class="desktop-list__item text--primary"><a class="uk-navbar-toggle" href="#">🔍</a></li><li class="desktop-list__item text--primary"><a href="#"><svg width="20" height="20"><circle r="4.4" cx="9.9" cy="6.4"/></svg>👤</a></li><li class="desktop-list__item desktop-list__item--cart"><a href="#">🛍</a></li></ul>
<div class="nav-overlay uk-navbar-left uk-flex-1" hidden></div></nav>
<nav class="header-menu__mobile uk-flex uk-flex-middle uk-flex-between uk-hidden@m" style="min-height: 115px;">
<div class="header-logo nav-overlay uk-flex uk-flex-middle"><a href="#" class="header-logo__link"><img src="logo-harakiri-liviano.png" class="header-logo__image" alt="Logo"></a></div>
<div class="mobile__actions" style="min-height: 115px;"><ul class="mobile__actions-list nav-overlay uk-flex uk-flex-row uk-flex-middle" style="min-height: 115px;"><li class="text--primary" style="margin:0 10px">🔍</li><li class="text--primary" style="margin:0 10px">🛍</li><li class="text--primary" style="margin:0 10px">☰</li></ul></div>
<div class="nav-overlay uk-navbar-left uk-flex-1" hidden></div></nav></div></div>
<h2 class="block-text__title uk-section-block__title uk-text-center" style="color:#000;text-align:center"><span>Harakiri Store</span></h2><p class="block-text__text" style="color:#000;text-align:center">✨️ Aquí encontrarás Makeup, Lentes, Skincare y más ✨️</p></body></html>
